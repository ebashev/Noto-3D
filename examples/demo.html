<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noto 3D — local demo</title>
<style>body{font:16px system-ui,sans-serif;background:#111318;color:#eef0f7;max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:40px;margin-bottom:8px}input,select{font:inherit;padding:12px;border:1px solid #454951;border-radius:8px;background:#20232a;color:inherit}input{width:min(90%,450px)}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:24px}.tile{background:#1d2027;padding:16px 8px;text-align:center;border-radius:10px;font-size:12px;overflow-wrap:anywhere}.tile img{display:block;width:64px;height:64px;margin:0 auto 8px}#sample img{width:1.5em;height:1.5em;vertical-align:middle}code{color:#b9cbff}p{line-height:1.6;color:#bec4d2}</style>
<h1>Noto 3D</h1><p>Локальная проверка изображений и Unicode-каталога. Показаны первые 120 совпадений.</p><p id="sample"></p><input id="search" aria-label="Поиск эмодзи" placeholder="cowboy, heart, 🤠…"><select id="format" aria-label="Размер"><option value="128">WebP 128</option><option value="256">WebP 256</option><option value="64">PNG 64</option></select><p id="count"></p><div id="grid"></div>
<script type="module">
import {emojis,searchEmojis,getEmojiPath,tokenize} from '../dist/index.js';
const base=new URL('../',location.href),grid=document.querySelector('#grid'),input=document.querySelector('#search'),format=document.querySelector('#format');
function image(emoji,size=128){const img=document.createElement('img');img.src=new URL(getEmojiPath(emoji,{format:size===64?'png':'webp',size}),base);img.alt=emoji;img.loading='lazy';img.decoding='async';img.onerror=()=>img.replaceWith(document.createTextNode(emoji));return img;}
for(const token of tokenize('Привет 🤠! Семья 👨‍👩‍👧‍👦, жест 👍🏽, флаг 🇷🇺, клавиша 1️⃣.'))document.querySelector('#sample').append(token.type==='emoji'?image(token.text):document.createTextNode(token.text));
function render(){const found=searchEmojis(input.value,{limit:120});document.querySelector('#count').textContent=`${emojis.length} записей в наборе; показано ${found.length}`;grid.replaceChildren();for(const e of found){const box=document.createElement('div');box.className='tile';box.append(image(e.emoji,Number(format.value)),document.createTextNode(e.name));grid.append(box);}}
input.addEventListener('input',render);format.addEventListener('change',render);render();
</script></html>
